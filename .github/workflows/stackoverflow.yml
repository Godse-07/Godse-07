name: Update StackOverflow Wisdom

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/updateCommitStats.js
      - name: Commit
        run: |
          git config user.name "so-bot"
          git config user.email "so-bot@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update StackOverflow wisdom" && git pull --rebase && git push)
